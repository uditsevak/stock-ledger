; Stock Ledger settings. Copy this file to settings.ini (same folder), change what you need,
; then run windows\restart-service.bat. Lines starting with ; are notes and are ignored.

[server]
; Port the app listens on. Phones on the factory Wi-Fi open http://<this-PC-IP>:<port>
port = 8000

[backup]
; Every day's backup is also copied into this folder, and the last 30 are kept there.
; Use a folder that Google Drive (in "Mirror files" mode) or OneDrive uploads.
; Its parent folder must already exist. Remove the ; in front of the line below and fix the path:
; offsite_dir = C:\Users\Owner\My Drive\Stock Ledger Backups
